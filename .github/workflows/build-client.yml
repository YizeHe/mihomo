name: Build TangentVPN Client

on:
  push:
    branches: [Meta]
    paths:
      - '*.go'
      - 'config.yaml'
      - 'gui/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production builds
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: TangentVPN-darwin-amd64
            tags: "with_gvisor"
            ldflags: "-s -w"
            backend: "http://47.84.235.137:7878"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: TangentVPN-darwin-arm64
            tags: "with_gvisor"
            ldflags: "-s -w"
            backend: "http://47.84.235.137:7878"
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: TangentVPN.exe
            tags: "with_gvisor"
            ldflags: "-s -w -H windowsgui"
            backend: "http://47.84.235.137:7878"
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: TangentVPN-linux-amd64
            tags: "with_gvisor"
            ldflags: "-s -w"
            backend: "http://47.84.235.137:7878"
          # Localtest builds
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: TangentVPN-darwin-amd64-localtest
            tags: "with_gvisor localtest"
            ldflags: "-s -w"
            backend: "http://127.0.0.1:7878"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: TangentVPN-darwin-arm64-localtest
            tags: "with_gvisor localtest"
            ldflags: "-s -w"
            backend: "http://127.0.0.1:7878"
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: TangentVPN_localtest.exe
            tags: "with_gvisor localtest"
            ldflags: "-s -w -H windowsgui"
            backend: "http://127.0.0.1:7878"
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: TangentVPN-linux-amd64-localtest
            tags: "with_gvisor localtest"
            ldflags: "-s -w"
            backend: "http://127.0.0.1:7878"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install dependencies (Windows)
        if: matrix.goos == 'windows'
        run: |
          choco install mingw -y

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -tags "${{ matrix.tags }}" -trimpath \
            -ldflags "${{ matrix.ldflags }} -X main.BackendURL=${{ matrix.backend }}" \
            -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build backend (Linux)
        working-directory: tangent-vpn-backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -o ../tangent-vpn-backend-linux .

      - name: Build backend (Windows)
        working-directory: tangent-vpn-backend
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -o ../tangent-vpn-backend.exe .

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            tangent-vpn-backend-linux
            tangent-vpn-backend.exe
