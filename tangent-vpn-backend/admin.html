<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TangentVPN 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:960px;padding:24px 16px}

/* ---- Login ---- */
#login-page{display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-card{background:#16213e;border-radius:12px;padding:48px 40px;width:380px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login-card h1{font-size:24px;margin-bottom:8px;color:#e94560}
.login-card p{font-size:14px;color:#8892b0;margin-bottom:32px}
.login-card input{width:100%;padding:12px 16px;border:1px solid #0f3460;border-radius:8px;background:#1a1a2e;color:#e0e0e0;font-size:15px;outline:none;margin-bottom:16px;transition:border-color .2s}
.login-card input:focus{border-color:#e94560}
.login-card button{width:100%;padding:12px;border:none;border-radius:8px;background:#e94560;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.login-card button:hover{background:#c73650}
.login-card .error{color:#e94560;font-size:13px;margin-bottom:12px;min-height:20px}

/* ---- Dashboard ---- */
#dashboard{display:none}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;color:#e94560}
.header-actions{display:flex;gap:10px}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#c73650}
.btn-secondary{background:#0f3460;color:#e0e0e0}
.btn-secondary:hover{background:#1a4a8a}
.btn-danger{background:#8b0000;color:#fff}
.btn-danger:hover{background:#a80000}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-ghost{background:transparent;color:#e94560;border:1px solid #e94560}
.btn-ghost:hover{background:#e94560;color:#fff}

.card{background:#16213e;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.card-header{padding:16px 20px;border-bottom:1px solid #0f3460;font-weight:600;font-size:15px}

/* ---- Table ---- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px;text-align:left;font-size:14px;border-bottom:1px solid #0f3460}
th{background:#0f3460;color:#8892b0;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:rgba(15,52,96,.4)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-active{background:#0a3d0a;color:#4caf50}
.badge-inactive{background:#3d0a0a;color:#e94560}
.actions-cell{display:flex;gap:8px;flex-wrap:wrap}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:#16213e;border-radius:12px;padding:32px;width:420px;max-width:92vw;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.modal h2{font-size:20px;margin-bottom:20px;color:#e94560}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#8892b0;margin-bottom:6px;font-weight:600}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid #0f3460;border-radius:8px;background:#1a1a2e;color:#e0e0e0;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:#e94560}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}

/* ---- Toast ---- */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:slideIn .3s ease}
.toast-success{background:#0a3d0a;border:1px solid #4caf50}
.toast-error{background:#3d0a0a;border:1px solid #e94560}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---- Empty state ---- */
.empty{text-align:center;padding:48px 16px;color:#8892b0}
.empty svg{margin-bottom:12px;opacity:.5}
</style>
</head>
<body>

<!-- ====== LOGIN PAGE ====== -->
<div id="login-page">
  <div class="login-card">
    <h1>TangentVPN</h1>
    <p>管理面板</p>
    <div class="error" id="login-error"></div>
    <input type="password" id="login-password" placeholder="管理员密码" autocomplete="current-password">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- ====== DASHBOARD ====== -->
<div id="dashboard">
  <div class="container">
    <div class="header">
      <h1>用户管理</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="loadUsers()">刷新</button>
        <button class="btn btn-primary" onclick="openCreateModal()">创建用户</button>
        <button class="btn btn-ghost" onclick="doLogout()">退出</button>
      </div>
    </div>
    <div class="card">
      <div class="card-header">用户列表</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>邮箱</th><th>创建时间</th><th>过期时间</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody id="user-table-body">
            <tr><td colspan="5" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ====== CREATE / EDIT MODAL ====== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">创建用户</h2>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="modal-email" placeholder="user@example.com">
    </div>
    <div class="form-group">
      <label id="modal-pw-label">密码</label>
      <input type="text" id="modal-password" placeholder="留空则不修改">
    </div>
    <div class="form-group">
      <label>过期时间</label>
      <input type="date" id="modal-expires">
    </div>
    <div class="form-group" id="modal-active-group" style="display:none">
      <label>状态</label>
      <select id="modal-active">
        <option value="true">启用</option>
        <option value="false">禁用</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-submit" onclick="submitModal()">创建</button>
    </div>
  </div>
</div>

<!-- ====== DELETE CONFIRM MODAL ====== -->
<div class="modal-overlay" id="delete-overlay">
  <div class="modal">
    <h2>确认删除</h2>
    <p style="margin-bottom:8px;color:#e0e0e0">确定要删除以下用户吗？此操作不可撤销。</p>
    <p style="color:#e94560;font-weight:600;margin-bottom:24px" id="delete-target"></p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- ====== TOAST CONTAINER ====== -->
<div class="toast-container" id="toast-container"></div>

<script>
// ---- State ----
let token = localStorage.getItem('admin_token') || '';
let editingEmail = '';
let deletingEmail = '';

// ---- Init ----
(function init() {
  if (token) { showDashboard(); }
  document.getElementById('login-password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
})();

// ---- Auth ----
function doLogin() {
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  if (!pw) { errEl.textContent = '请输入密码'; return; }
  errEl.textContent = '';

  fetch('/api/admin/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  })
  .then(r => r.json())
  .then(data => {
    if (data.valid && data.token) {
      token = data.token;
      localStorage.setItem('admin_token', token);
      showDashboard();
    } else {
      errEl.textContent = '密码错误';
    }
  })
  .catch(() => { errEl.textContent = '网络错误，请重试'; });
}

function doLogout() {
  token = '';
  localStorage.removeItem('admin_token');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('login-password').value = '';
}

function showDashboard() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadUsers();
}

// ---- API helper ----
function api(method, url, body) {
  const opts = {
    method: method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(r => {
    if (r.status === 401) { doLogout(); throw new Error('认证已过期，请重新登录'); }
    return r.json();
  });
}

// ---- Users ----
function loadUsers() {
  const tbody = document.getElementById('user-table-body');
  tbody.innerHTML = '<tr><td colspan="5" class="empty">加载中...</td></tr>';

  api('GET', '/api/users')
  .then(users => {
    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无用户</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => {
      const created = formatDate(u.created_at);
      const expires = formatDate(u.expires_at);
      const statusClass = u.is_active ? 'badge-active' : 'badge-inactive';
      const statusText = u.is_active ? '启用' : '禁用';
      return `<tr>
        <td>${esc(u.email)}</td>
        <td>${created}</td>
        <td>${expires}</td>
        <td><span class="badge ${statusClass}">${statusText}</span></td>
        <td class="actions-cell">
          <button class="btn btn-secondary btn-sm" onclick="openEditModal('${esc(u.email)}')">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="openDeleteModal('${esc(u.email)}')">删除</button>
        </td>
      </tr>`;
    }).join('');
  })
  .catch(err => {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">加载失败: ' + esc(err.message) + '</td></tr>';
    toast(err.message, 'error');
  });
}

// ---- Create Modal ----
function openCreateModal() {
  editingEmail = '';
  document.getElementById('modal-title').textContent = '创建用户';
  document.getElementById('modal-pw-label').textContent = '密码';
  document.getElementById('modal-email').value = '';
  document.getElementById('modal-email').disabled = false;
  document.getElementById('modal-password').value = '';
  document.getElementById('modal-password').placeholder = '请输入密码';
  document.getElementById('modal-expires').value = defaultExpiry();
  document.getElementById('modal-active-group').style.display = 'none';
  document.getElementById('modal-submit').textContent = '创建';
  document.getElementById('modal-overlay').classList.add('show');
}

// ---- Edit Modal ----
function openEditModal(email) {
  editingEmail = email;
  document.getElementById('modal-title').textContent = '编辑用户';
  document.getElementById('modal-pw-label').textContent = '新密码（留空则不修改）';
  document.getElementById('modal-email').value = email;
  document.getElementById('modal-email').disabled = true;
  document.getElementById('modal-password').value = '';
  document.getElementById('modal-password').placeholder = '留空则不修改';
  document.getElementById('modal-active-group').style.display = 'block';

  // Fetch current user info from the users list
  api('GET', '/api/users')
  .then(users => {
    const u = users.find(x => x.email === email);
    if (u) {
      document.getElementById('modal-expires').value = u.expires_at ? u.expires_at.substring(0, 10) : '';
      document.getElementById('modal-active').value = u.is_active ? 'true' : 'false';
    }
  })
  .catch(() => {});

  document.getElementById('modal-submit').textContent = '保存';
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function submitModal() {
  const email = document.getElementById('modal-email').value.trim();
  const password = document.getElementById('modal-password').value;
  const expiresRaw = document.getElementById('modal-expires').value;
  const expiresAt = expiresRaw ? expiresRaw + 'T00:00:00Z' : '';

  if (!email) { toast('请输入邮箱', 'error'); return; }

  if (!editingEmail) {
    // Create
    if (!password) { toast('请输入密码', 'error'); return; }
    const body = { email: email, password: password };
    if (expiresAt) body.expires_at = expiresAt;
    api('POST', '/api/users', body)
    .then(data => {
      if (data.error) { toast(data.error, 'error'); return; }
      toast('用户创建成功');
      closeModal();
      loadUsers();
    })
    .catch(err => toast(err.message, 'error'));
  } else {
    // Update
    const body = {};
    if (password) body.password = password;
    if (expiresAt) body.expires_at = expiresAt;
    body.is_active = document.getElementById('modal-active').value === 'true';
    api('PUT', '/api/users/' + encodeURIComponent(editingEmail), body)
    .then(data => {
      if (data.error) { toast(data.error, 'error'); return; }
      toast('用户更新成功');
      closeModal();
      loadUsers();
    })
    .catch(err => toast(err.message, 'error'));
  }
}

// ---- Delete Modal ----
function openDeleteModal(email) {
  deletingEmail = email;
  document.getElementById('delete-target').textContent = email;
  document.getElementById('delete-overlay').classList.add('show');
}

function closeDeleteModal() {
  document.getElementById('delete-overlay').classList.remove('show');
  deletingEmail = '';
}

function confirmDelete() {
  if (!deletingEmail) return;
  api('DELETE', '/api/users/' + encodeURIComponent(deletingEmail))
  .then(data => {
    if (data.error) { toast(data.error, 'error'); return; }
    toast('用户已删除');
    closeDeleteModal();
    loadUsers();
  })
  .catch(err => toast(err.message, 'error'));
}

// ---- Utilities ----
function formatDate(iso) {
  if (!iso) return '-';
  try {
    const d = new Date(iso);
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  } catch { return iso; }
}

function defaultExpiry() {
  const d = new Date();
  d.setDate(d.getDate() + 30);
  return d.toISOString().substring(0, 10);
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, type) {
  type = type || 'success';
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

// Close modals on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('delete-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeDeleteModal();
});
</script>
</body>
</html>
